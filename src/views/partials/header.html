<script>
    function setLanguage(lang) {
        if (lang === 'en') {
            // Reset to original language
            document.cookie = "googtrans=; path=/; domain=" + window.location.hostname;
        } else {
            document.cookie = "googtrans=/en/" + lang + "; path=/; domain=" + window.location.hostname;
        }

        location.reload();
    }
</script>
