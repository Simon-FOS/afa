<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Create Event</h1>
    <a href="/admin/event" class="btn btn-secondary">
      <i class="fas fa-arrow-left me-2"></i>Back to List
    </a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <form action="/admin/event/create" enctype="multipart/form-data" id="create-form" class="needs-validation"
        method="POST" novalidate>
        <div class="row">
          <div class="col-md-6">
            <div class="mb-3">
              <label for="title" class="form-label">Title</label>
              <input type="text" name="title" class="form-control" id="title" placeholder="Enter title" required>
              <div class="invalid-feedback">
                Please provide a valid title.
              </div>
            </div>
          </div>
          <!-- Add more form fields in columns as needed -->

          <!--tag-->
          <div class="col-md-6">
            <div class="mb-3">
              <label for="tag" class="form-label">Tag</label>
              <input type="text" name="tag" class="form-control" id="tag" placeholder="Enter tag">
              <div class="invalid-feedback">
                Please provide a valid tag.
              </div>
            </div>
          </div>

          <!--content-->
          <div class="col-md-6">
            <div class="mb-3">
              <label for="content" class="form-label">Content</label>
              <textarea name="content" class="form-control" id="content" placeholder="Enter content" rows="4"
                required></textarea>
              <div class="invalid-feedback">
                Please provide a valid content.
              </div>
            </div>
          </div>
          <!--Image-->
          <div class="col-md-6">
            <div class="mb-3">
              <label for="image" class="form-label">Image File</label>
              <input type="file" name="image_url" class="form-control" id="image" accept="image/*">
              <div class="invalid-feedback">
                Please provide a valid image file.
              </div>
            </div>
          </div>
        </div>

        <!--location-->
        <div class="col-md-6">
          <div class="mb-3">
            <label for="location" class="form-label">Location</label>
            <input type="text" name="location" class="form-control" id="location" placeholder="Enter location">
            <div class="invalid-feedback">
              Please provide a valid location.
            </div>
          </div>
        </div>

        <!--date-->
        <div class="col-md-6">
          <div class="mb-3">
            <label for="date" class="form-label">Date</label>
            <input type="date" name="date" class="form-control" id="date">
            <div class="invalid-feedback">
              Please provide a valid date.
            </div>
          </div>
        </div>

        <ul id="error" class="text-danger col-12"></ul>

        <div class="spinner-border col-12 d-none" id="status" role="status">
          <span class="sr-only">Loading...</span>
        </div>
        <progress id="progressBar" style="display: none;"></progress>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-plus me-2"></i>Create event
          </button>
          <a href="/admin/event" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
